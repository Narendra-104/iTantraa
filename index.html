<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iTantra Demo - SIH</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            color: #00ff00;
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 1.2rem;
            color: #aaaaaa;
            margin-bottom: 40px;
        }
        .container {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 800px;
        }
        .card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 40px 30px;
            width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.3s, border-color 0.3s;
        }
        .card:hover {
            transform: translateY(-5px);
            border-color: #00ff00;
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.5rem;
            color: #ffffff;
        }
        .card p {
            color: #cccccc;
            margin-bottom: 10px;
        }
        .small-text {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 25px;
        }
        .action-btn {
            background-color: #00ff00;
            color: #121212;
            text-decoration: none;
            padding: 12px 25px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 80%;
        }
        .action-btn:hover {
            background-color: #00cc00;
        }
        .btn-outline {
            background-color: transparent;
            color: #00ff00;
            border: 2px solid #00ff00;
        }
        .btn-outline:hover {
            background-color: rgba(0, 255, 0, 0.1);
        }
    </style>
</head>
<body>
    <h1>iTantra Demo</h1>
    <p class="subtitle">SIH Presentation Portal</p>
    
    <div class="container">

        <!-- QR Code Card -->
        <div class="card">
            <h2>SCAN TO DOWNLOAD</h2>
            <p>Scan with Mobile</p>
            <p class="small-text">Use your mobile to install</p>
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://raw.githubusercontent.com/Narendra-104/iTantraa/main/iTantra-v5.apk" alt="Download QR Code" style="width: 150px; height: 150px; border-radius: 8px; margin-top: 10px;" />
        </div>

        <!-- Android App Card -->
        <div class="card">
            <h2>📱 ANDROID APP</h2>
            <p>Download APK</p>
            <p class="small-text">Install and test on an Android phone</p>
            <a href="iTantra-v5.apk" download class="action-btn" style="box-sizing: border-box;">Download APK</a>
        </div>
    </div>
</body>
</html>
